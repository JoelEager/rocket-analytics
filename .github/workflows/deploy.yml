name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 */6 * * *"  # Rebuild every 6 hours (off the congested top-of-hour slot) to get fresh launch data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pushes supersede any run in progress; scheduled runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: launch_cache.json
          key: launch-cache-${{ github.run_id }}
          restore-keys: launch-cache-
      - run: pip install -r requirements.txt
      # Use max-cache-age to reuse cache if it's less than 5 hours old
      - run: python main.py --max-cache-age 5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
